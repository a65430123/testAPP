<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>星憶旅團</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10141c;
        overflow: hidden;
        font-family: system-ui, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
      }

      /* 登入畫面 */
      #login {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #2b4a3a, #10141c 75%);
        z-index: 20;
      }
      .login-box {
        width: min(320px, calc(100vw - 48px));
        padding: 28px 24px;
        border-radius: 14px;
        background: rgba(16, 22, 30, 0.88);
        color: #fff;
        text-align: center;
        box-sizing: border-box;
      }
      .login-box h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: 4px;
      }
      .login-box p {
        margin: 0 0 18px;
        color: #b9c7c0;
        font-size: 14px;
      }
      .login-box input,
      .login-box button {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 16px;
        font-family: inherit;
      }
      .login-box input {
        border: 1px solid #47604f;
        background: #0e141a;
        color: #fff;
        margin-bottom: 10px;
      }
      .login-box button {
        border: none;
        background: #5fae6b;
        color: #0d1a12;
        font-weight: 700;
        cursor: pointer;
      }
      .login-box button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .login-error {
        min-height: 20px;
        margin-top: 10px;
        color: #ff9d9d;
        font-size: 14px;
      }

      /* 聊天視窗 */
      #chat {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: min(380px, calc(100vw - 24px));
        z-index: 10;
        font-size: 14px;
        color: #fff;
      }
      .chat-log {
        height: 150px;
        overflow-y: auto;
        padding: 6px 8px;
        border-radius: 8px 8px 0 0;
        background: rgba(0, 0, 0, 0.45);
        line-height: 1.5;
        word-break: break-all;
      }
      .chat-log .chat-world {
        color: #ffd97a;
      }
      .chat-log .chat-system {
        color: #9fd8ff;
      }
      .chat-form {
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 0 0 8px 8px;
        background: rgba(0, 0, 0, 0.6);
      }
      .chat-form select,
      .chat-form input {
        border: 1px solid #47604f;
        border-radius: 6px;
        background: #0e141a;
        color: #fff;
        padding: 6px 8px;
        font-size: 14px;
        font-family: inherit;
      }
      .chat-form input {
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

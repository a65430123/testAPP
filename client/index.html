<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>星憶旅團</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10141c;
        overflow: hidden;
        font-family: system-ui, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
      }

      /* 登入與選角畫面 */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        background: radial-gradient(circle at 50% 35%, #2b4a3a, #10141c 75%);
        z-index: 20;
      }
      .panel {
        width: min(340px, calc(100vw - 32px));
        margin: 16px 0;
        padding: 26px 24px;
        border-radius: 14px;
        background: rgba(16, 22, 30, 0.9);
        color: #fff;
        text-align: center;
        box-sizing: border-box;
      }
      .panel.wide {
        width: min(480px, calc(100vw - 32px));
      }
      .panel h1 {
        margin: 0 0 12px;
        font-size: 26px;
        letter-spacing: 3px;
      }
      .panel h2 {
        margin: 18px 0 10px;
        font-size: 16px;
      }
      .panel p {
        margin: 0 0 12px;
        color: #b9c7c0;
        font-size: 14px;
      }
      .panel input,
      .panel button {
        box-sizing: border-box;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
      }
      .panel input {
        display: block;
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 10px;
        border: 1px solid #47604f;
        background: #0e141a;
        color: #fff;
      }
      .panel input[hidden] {
        display: none;
      }
      .panel button {
        padding: 9px 12px;
        border: 1px solid #47604f;
        background: #18222b;
        color: #dfe9e3;
        cursor: pointer;
      }
      .panel button.primary {
        width: 100%;
        border: none;
        background: #5fae6b;
        color: #0d1a12;
        font-weight: 700;
      }
      .panel button.active {
        border-color: #5fae6b;
        background: #274a31;
        color: #fff;
      }
      .panel button.link {
        margin-top: 14px;
        border: none;
        background: none;
        color: #9fb4a8;
        text-decoration: underline;
      }
      .panel button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .panel .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .panel .tabs button {
        flex: 1;
      }
      .panel .error {
        min-height: 20px;
        margin-top: 10px;
        color: #ff9d9d;
        font-size: 14px;
      }
      .panel .muted {
        color: #8fa399;
        font-size: 13px;
      }
      .char-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .panel .char-card {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 12px 14px;
        text-align: left;
      }
      .panel .char-card:hover {
        border-color: #5fae6b;
      }
      .char-card strong {
        font-size: 17px;
        color: #fff;
      }
      .char-card .muted {
        margin-left: auto;
      }
      .class-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 8px;
      }

      /* 背包視窗 */
      #inventory {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        color: #fff;
        font-size: 14px;
        text-align: right;
      }
      .inv-toggle {
        padding: 6px 14px;
        border: 1px solid #47604f;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      .inv-body {
        width: min(300px, calc(100vw - 24px));
        margin-top: 6px;
        padding: 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        text-align: left;
        box-sizing: border-box;
      }
      .inv-coins {
        margin-bottom: 8px;
        color: #ffd97a;
      }
      .inv-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        max-height: 260px;
        overflow-y: auto;
      }
      .inv-item {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        padding: 5px 8px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
      }
      .inv-qty {
        color: #b9c7c0;
      }
      .inv-empty {
        grid-column: 1 / -1;
        color: #8fa399;
      }

      .inv-item.usable {
        cursor: pointer;
        outline: 1px solid rgba(95, 174, 107, 0.6);
      }
      .inv-item.usable:hover {
        background: rgba(95, 174, 107, 0.3);
      }

      /* 個人狀態與素質 */
      #status {
        position: fixed;
        top: 62px;
        left: 12px;
        width: 210px;
        z-index: 10;
        color: #fff;
        font-size: 13px;
      }
      .st-title {
        margin-bottom: 4px;
        text-shadow: 0 0 3px #000, 0 0 3px #000;
      }
      .st-bar {
        position: relative;
        height: 16px;
        margin-bottom: 3px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
      .st-fill {
        height: 100%;
        width: 0;
        transition: width 0.15s;
      }
      .st-hp .st-fill {
        background: #d9534f;
      }
      .st-sp .st-fill {
        background: #4f8fd9;
      }
      .st-exp .st-fill {
        background: #d9b84f;
      }
      .st-bar span {
        position: absolute;
        inset: 0;
        line-height: 16px;
        text-align: center;
        font-size: 11px;
        text-shadow: 0 0 2px #000;
      }
      #status button {
        border: 1px solid #47604f;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
      }
      #status button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .st-toggle {
        margin-top: 3px;
        padding: 4px 12px;
      }
      .st-toggle.has-points {
        border-color: #ffd97a;
        color: #ffd97a;
      }
      .st-stats {
        margin-top: 6px;
        padding: 8px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.65);
      }
      .st-points {
        margin-bottom: 6px;
        color: #ffd97a;
      }
      .st-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .st-row button {
        padding: 2px 8px;
      }
      .st-derived {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        color: #c8d6ce;
        font-size: 12px;
        white-space: pre-line;
      }

      /* 技能列 */
      #skills {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      #skills button {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 54px;
        border: 1px solid #6b8f76;
        border-radius: 8px;
        background: rgba(10, 20, 16, 0.8);
        color: #fff;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #skills button small {
        color: #8fc0ff;
        font-size: 11px;
      }
      #skills button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .sk-cd {
        position: absolute;
        top: 2px;
        right: 5px;
        color: #ffd97a;
        font-size: 11px;
      }
      @media (max-width: 760px) {
        #skills {
          bottom: 210px;
        }
      }

      /* 聊天視窗 */
      #chat {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: min(380px, calc(100vw - 24px));
        z-index: 10;
        font-size: 14px;
        color: #fff;
      }
      .chat-log {
        height: 150px;
        overflow-y: auto;
        padding: 6px 8px;
        border-radius: 8px 8px 0 0;
        background: rgba(0, 0, 0, 0.45);
        line-height: 1.5;
        word-break: break-all;
      }
      .chat-log .chat-world {
        color: #ffd97a;
      }
      .chat-log .chat-system {
        color: #9fd8ff;
      }
      .chat-form {
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 0 0 8px 8px;
        background: rgba(0, 0, 0, 0.6);
      }
      .chat-form select,
      .chat-form input {
        border: 1px solid #47604f;
        border-radius: 6px;
        background: #0e141a;
        color: #fff;
        padding: 6px 8px;
        font-size: 14px;
        font-family: inherit;
      }
      .chat-form input {
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
